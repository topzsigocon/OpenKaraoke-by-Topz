name: Android Build

# Hindi tumatakbo kapag zip lang ang in-upload; ang "Unpack zip and build" ang bahala roon.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.zip'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenKaraoke-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
