name: Diag APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'diag/**'
      - '.github/workflows/diag.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build diag APK
        run: gradle -p diag assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenKaraoke-DIAG-apk
          path: diag/app/build/outputs/apk/debug/*.apk
